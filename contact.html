<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Flip 7 Score Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f9fa;
            color: #2c3e50;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #1E88E5;
        }

        .subtitle {
            color: #8a9baa;
            margin-bottom: 40px;
            font-size: 0.9rem;
        }

        h2 {
            font-size: 1.3rem;
            margin-top: 32px;
            margin-bottom: 12px;
            color: #E91E63;
        }

        p {
            color: #5a6d7e;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        a {
            color: #1E88E5;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .contact-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #d8ecee;
            box-shadow: 0 2px 8px rgba(128, 203, 209, 0.1);
            margin-top: 16px;
        }

        .contact-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #E91E63;
        }

        .email {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .back {
            display: inline-block;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact</h1>
        <p class="subtitle">We'd love to hear from you</p>

        <h2>App Support</h2>
        <p>For questions, feedback, bug reports, or any support requests related to Flip 7 Score Tracker, please reach out by email. We do our best to respond promptly.</p>

        <div class="contact-card">
            <h3>Email</h3>
            <p class="email"><a href="mailto:jdi-apps@proton.me">jdi-apps@proton.me</a></p>
        </div>

        <a class="back" href="index.html">&larr; Back to Home</a>
    </div>
</body>
</html>
